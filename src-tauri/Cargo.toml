[package]
name = "baimo-desktop"
version = "0.1.1"
description = "白墨记账系统桌面版"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
default-run = "baimo-desktop"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "2.4"

[dependencies]
tauri = { version = "2.0", features = ["devtools"] }
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-clipboard-manager = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
uuid = { version = "1.0", features = ["v4"] }
base64 = "0.22"
image = "0.24"
tiff = "0.9"
weezl = "0.1"  # LZW 解压缩（用于 TIFF）
walkdir = "2.5"
rfd = "0.16"

# SQLite 直接访问 (使用 bundled 特性避免系统依赖)
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
tauri-plugin-opener = "2.5.3"
md5 = "0.7"

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

# 发布模式优化配置
[profile.release]
opt-level = 3           # 最高优化级别
lto = true              # 启用链接时优化,减小体积
codegen-units = 1       # 单个代码生成单元,最佳优化
strip = true            # 移除调试符号,减小体积
panic = "abort"         # panic 时直接终止,减小体积

[lints.rust]
# Tauri 使用 cfg(mobile) 条件编译，需要告诉 rustc 这是预期的
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(mobile)'] }
