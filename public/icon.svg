<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="512" height="512" rx="96" fill="url(#gradient)"/>

  <!-- P字母印章效果 -->
  <g filter="url(#shadow)">
    <!-- 外圆 -->
    <circle cx="256" cy="256" r="180" stroke="#fff" stroke-width="12" fill="none" opacity="0.3"/>

    <!-- P字母 -->
    <text x="256" y="330"
          font-family="'Inter', 'SF Pro Display', -apple-system, sans-serif"
          font-size="280"
          font-weight="700"
          fill="#ffffff"
          text-anchor="middle"
          dominant-baseline="middle"
          style="text-shadow: 0 4px 12px rgba(0,0,0,0.3);">
      P
    </text>
  </g>

  <!-- 装饰点 -->
  <circle cx="100" cy="100" r="20" fill="#ffffff" opacity="0.2"/>
  <circle cx="412" cy="100" r="20" fill="#ffffff" opacity="0.2"/>
  <circle cx="100" cy="412" r="20" fill="#ffffff" opacity="0.2"/>
  <circle cx="412" cy="412" r="20" fill="#ffffff" opacity="0.2"/>

  <!-- 渐变定义 -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a5f4c"/>
      <stop offset="100%" style="stop-color:#237a62"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
</svg>
